[Settings]
ImeIndicatorEnabled=1
StartupLayout=FMIX13f-Minato[Built-in]
HoldTh=300
LayerHoldTh=150 ;Layers.HoldThに設定される
b_time=50
LogEnabled=0
MaxLog=5000
space=NAVI_CTRL
noconv=SHORTCUT_CTRL

[1]
ver=2
Name=FMIX13f-Minato
Layout=FMIX13f
LayoutIME=Minato

[2]
ver=2 ;ver2の利用を推奨
Name=FMIX13f-Kanade
Layout=FMIX13f
LayoutIME=Kanade

[FMIX13f]
Mode=1 ;LKeyのモード指定
L00= 1 2 3 4 5 6 7 8 9 0 - ^ \
L01= q w r f k y l u p {sc027} @ [
L02= a s d t g h n e i o : ]
L03= z x c v b j m , . / \

[Minato]
Mode=4 ;LKeyのモード指定
L00= 1 2 3 4 5 6 7 8 9 0 - ^ \
L01= q w d r f y l u p {sc027} @ [
L02= a s k t g h n e i o : ]
L03= z x c v b j ya , . / \

m_a+s=abc
[Kanade]
Mode=4 ;LKeyのモード指定
L00=1 2 3 4 5 6 7  8 9  0 - ^ \
L01=q w r p l f yu u yo - @ [
L02=k s t n h {sc027} a  i e  o : ]
L03=g z d m b j m  , .  / \
S00=1 2 3 4 5 6 7   8  9  0 - ^ \
S01=q w r p l f yu  u  yo - @ [
S02=k s t n h {sc027} ya  xi xe o : ]
S03=[ ] d m b j ltu ,  .  / \
m_r+p=areru
